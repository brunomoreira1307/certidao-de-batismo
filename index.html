<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Declaração de Batismo - Paróquia N. S. do Carmo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .header-ui { text-align: center; margin-bottom: 20px; }
        .header-ui img.brasao-tela { width: 120px; height: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        
        h2 { text-align: center; color: #d35400; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-top: 0; margin-bottom: 30px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        label { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; color: #2c3e50; font-family: 'Georgia', serif; }
        input { font-family: 'Georgia', serif; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: #d35400; outline: none; }
        
        /* Estilização dos Botões */
        .btn-container { margin-top: 25px; }
        button {
            font-family: 'Georgia', serif;
            width: 100%; padding: 15px; color: white;
            border: none; border-radius: 4px; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-bottom: 12px; transition: background 0.3s;
        }
        .btn-colorido { background-color: #d35400; }
        .btn-colorido:hover { background-color: #e67e22; }
        
        .btn-branco { background-color: #7f8c8d; }
        .btn-branco:hover { background-color: #95a5a6; }
        
        hr { border: 0; height: 1px; background: #eee; margin: 25px 0; }
    </style>
</head>
<body>

    <img id="imgFundo" src="fundo.jpg" alt="Papel Timbrado" crossorigin="anonymous" style="display: none;">

    <div class="header-ui">
        <img class="brasao-tela" src="brasao.png" alt="Brasão Paróquia">
        <h2>Declaração de Batismo</h2>
        <p class="subtitle">Preencha os dados para gerar o documento oficial</p>
    </div>

    <div class="grid-3">
        <div><label>Livro nº</label><input type="text" id="livro" placeholder="Ex: 10"></div>
        <div><label>Folha nº</label><input type="text" id="folha" placeholder="Ex: 45"></div>
        <div><label>Registro nº</label><input type="text" id="numero" placeholder="Ex: 120"></div>
    </div>

    <hr>

    <div class="grid">
        <div class="full-width"><label>Nome do Batizado</label><input type="text" id="nome"></div>
        <div><label>Data de Nascimento</label><input type="text" id="nascimento" placeholder="Ex: 10/05/2020"></div>
        <div><label>Naturalidade</label><input type="text" id="naturalidade" placeholder="Ex: Carmo da Cachoeira - MG"></div>
        <div class="full-width"><label>Nome do Pai e da Mãe</label><input type="text" id="pais"></div>
        <div class="full-width"><label>Nome dos Padrinhos</label><input type="text" id="padrinhos"></div>
        
        <div><label>Data do Batismo</label><input type="text" id="data_batismo" placeholder="Ex: 15/06/2020"></div>
        <div><label>Ministro (Padre / Diácono)</label><input type="text" id="ministro"></div>
        <div class="full-width"><label>Data de Emissão do Documento</label><input type="text" id="data_emissao" value="08 de junho de 2026"></div>
    </div>

    <div class="btn-container">
        <button class="btn-colorido" onclick="gerarPDF(true)">Gerar PDF com Papel Timbrado (Digital)</button>
        
        <button class="btn-branco" onclick="gerarPDF(false)">Gerar PDF em Branco (Para imprimir em papel já timbrado)</button>
    </div>

    <script>
        function gerarPDF(incluirFundo) {
            const { jsPDF } = window.jspdf;
            
            const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

            const livro = document.getElementById('livro').value;
            const folha = document.getElementById('folha').value;
            const numero = document.getElementById('numero').value;
            const nome = document.getElementById('nome').value;
            const nascimento = document.getElementById('nascimento').value;
            const naturalidade = document.getElementById('naturalidade').value;
            const pais = document.getElementById('pais').value;
            const padrinhos = document.getElementById('padrinhos').value;
            const data_batismo = document.getElementById('data_batismo').value;
            const ministro = document.getElementById('ministro').value;
            const data_emissao = document.getElementById('data_emissao').value;

            if(!nome || !livro) {
                alert("Por favor, preencha ao menos o Nome e o Livro para gerar o documento.");
                return;
            }

            // Configurações Geométricas e Margens Estritas
            const marginLeft = 30;   
            const marginRight = 20;  
            const pageWidth = 210;   
            const pageHeight = 297;
            const contentWidth = pageWidth - marginLeft - marginRight; 
            const centerX = marginLeft + (contentWidth / 2); 

            // --- 1. CONDIÇÃO DO PAPEL TIMBRADO ---
            if (incluirFundo) {
                const imgElement = document.getElementById('imgFundo');
                if (imgElement.complete && imgElement.naturalHeight !== 0) {
                    doc.addImage(imgElement, 'JPEG', 0, 0, pageWidth, pageHeight);
                }
            }

            // Define a família tipográfica clássica do PDF
            doc.setFont("times");

            // --- 2. TÍTULO DO DOCUMENTO ---
            // Y = 80mm preserva o topo exatamente livre (seja digital ou no papel físico)
            const startY = 80; 
            doc.setFont("times", "bold");
            doc.setFontSize(14);
            doc.text("DECLARAÇÃO DE BATISMO", centerX, startY, { align: "center" });

            // --- 3. TEXTO PRINCIPAL (Tamanho 14, Espaçamento 1.5) ---
            doc.setFont("times", "normal");
            doc.setFontSize(14);
            
            const textoPadrao = `Certifico que, às folhas ${folha} do Livro ${livro} de Registros de Batismos, sob o número ${numero}, encontra-se o registro de ${nome}, nascido(a) aos ${nascimento}, natural de ${naturalidade}, filho(a) de ${pais}. Foi batizado(a) nesta Paróquia aos ${data_batismo}, pelo ${ministro}, tendo como padrinhos ${padrinhos}.`;

            doc.text(textoPadrao, marginLeft, startY + 20, { 
                maxWidth: contentWidth, 
                align: "justify",
                lineHeightFactor: 1.5
            });

            // --- 4. DATA ---
            const textoData = `Carmo da Cachoeira, ${data_emissao}.`;
            doc.setFontSize(12); 
            doc.text(textoData, pageWidth - marginRight, 190, { align: "right" });

            // --- 5. ASSINATURA ---
            doc.text("___________________________________________________", centerX, 230, { align: "center" });
            doc.text("Pároco", centerX, 237, { align: "center" });

            // --- 6. NOME DO ARQUIVO ORGANIZADO ---
            const primeiroNome = nome.trim().split(/\s+/)[0];
            doc.save(`Certidao_Batismo_${primeiroNome}.pdf`);
        }
    </script>
</body>
</html>
